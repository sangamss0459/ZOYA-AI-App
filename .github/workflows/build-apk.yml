name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version 2>&1
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -n 's/.*"\([0-9][0-9._]*\)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Could not detect Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          FIRST_PART="${RAW_VER%%.*}"
          if [ "$FIRST_PART" = "1" ]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$FIRST_PART"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, found Java $MAJOR_VER"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Node.js and prepare Capacitor Android bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and sync local web assets
        run: |
          set -euo pipefail
         npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore could not be created."
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "android/app/build/outputs/apk" ]; then
              echo "Discovered APK files inside android/app/build/outputs/apk:"
              find "android/app/build/outputs/apk" -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH must be a non-empty regular file."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SRC_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "::error::Verified APK missing at $SRC_APK"
            exit 1
          fi
          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          DEST_APK="${TEMP_DIR}/${ASSET_NAME}"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset does not exist or is empty; skipping release creation."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          cat > "$NOTES_FILE" <<EOF
          - **Build Type**: Automatically generated debug APK built by GitHub Actions
          - **Workflow Run**: #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})
          - **Source Commit SHA**: \`${GITHUB_SHA}\`
          - **Purpose**: Intended for testing only — **not** a Play Store production release
          - **Signing**: Signed only with a temporary debug keystore
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
            RELEASE_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq .name)"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **Release Page**: ${RELEASE_URL}"
              echo "- **APK Asset**: \`${ASSET_NAME}\` (download directly from the release **Assets** section)"
              echo "- **Backup Artifact**: GitHub Actions artifact \`app-debug-apk\` is also available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and Actions artifact upload succeeded."
            echo "Backup artifact available: app-debug-apk"
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning**: GitHub Release creation did not succeed, but your debug APK build and Actions artifact upload completed cleanly."
              echo ""
              echo "- **Backup Artifact**: Download \`app-debug-apk\` directly from this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
