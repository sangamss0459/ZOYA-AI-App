name: Build ZOYA Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "ZOYA AI Hosted HTTPS URL (leave default for Shared App URL)"
        required: false
        default: "https://ais-pre-osmvxgk3kqe76rkeoztozv-262582699932.asia-northeast1.run.app"

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install dependencies and Capacitor Android platform
        run: |
          npm install
          npm install --no-save @capacitor/cli@^8.6.2 @capacitor/android@^8.6.2

      - name: Build web bundle and sync Capacitor Android
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          npm run build
          npx cap sync android

      - name: Build Debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload ZOYA AI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zoya-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
